[package]
name = "embassy_crypto_sw"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[features]
default = []
alloc = []
rsa = ["dep:rsa", "alloc", "dep:rand_core"]
cortex-m4-p256 = ["dep:p256-cortex-m4"]

[dependencies]
embassy_crypto_driver = { path = "../embassy_crypto_driver" }

# Symmetric crypto (RustCrypto)
aes = { version = "0.8", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
ccm = { version = "0.5", default-features = false }
cmac = { version = "0.7", default-features = false }
digest = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }

# Elliptic curves (RustCrypto)
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa"] }
p384 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa"] }
signature = { version = "2", default-features = false }

# P-256 assembly acceleration for Cortex-M4 / Cortex-M33
# Uses hand-written UMAAL assembly by Emill. On non-Cortex-M4 targets,
# automatically falls back to the pure-Rust p256 implementation.
p256-cortex-m4 = { git = "https://github.com/ycrypto/p256-cortex-m4", default-features = false, features = ["non-cortex-m4-fallback"], optional = true }

# RSA (optional, requires alloc)
rsa = { version = "0.9", optional = true, default-features = false, features = ["sha2"] }
rand_core = { version = "0.6", optional = true, default-features = false }
